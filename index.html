
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面加载中 - 百度一下</title>
    <!-- 防缓存Meta标签 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 pulse">
        <!-- 百度Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                <i class="fas fa-search text-blue-500 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">制暴Ⅲ天下大乱</h1>
        </div>

        <!-- 加载进度 -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-600">页面加载中</span>
                <span id="percent" class="text-sm font-bold text-blue-500">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="progressBar" class="progress-bar h-3 rounded-full bg-gradient-to-r from-blue-400 to-purple-500" style="width: 0%"></div>
        </div>

        <!-- 加载提示 -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center text-blue-500">
                <i class="fas fa-sync-alt animate-spin mr-2"></i>
                <span class="text-sm">正在为您跳转，请稍候...</span>
            </div>

        <!-- 手动跳转按钮 -->
        <div class="space-y-3">
            <button id="manualJump" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-medium hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                <i class="fas fa-external-link-alt mr-2"></i>
                立即跳转
            </button>
            
            <button id="refreshPage" class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-200 transition-all duration-300">
                <i class="fas fa-redo mr-2"></i>
                刷新页面
            </button>
        </div>

        <!-- 状态信息 -->
        <div class="mt-6 p-4 bg-blue-50 rounded-lg">
            <div class="flex items-center text-blue-700">
                <i class="fas fa-info-circle mr-2"></i>
                <span class="text-sm">如果长时间未跳转，请点击上方按钮</span>
            </div>
        </div>
    </div>

    <script>
        // 防缓存参数
        const timestamp = Date.now();
        const randomId = Math.random().toString(36).substr(2, 9);
        
        // 目标URL
        const targetUrl = "http://www.px1.top:28000/";
        
        // 初始化变量
        let progress = 0;
        let progressInterval;
        
        // DOM元素
        const progressBar = document.getElementById('progressBar');
        const percentElement = document.getElementById('percent');
        const manualJumpBtn = document.getElementById('manualJump');
        const refreshPageBtn = document.getElementById('refreshPage');
        
        // 页面加载时清除缓存
        window.addEventListener('load', function() {
            // 强制清除可能的缓存
            if (performance && performance.navigation && performance.navigation.type === 1) {
                // 页面是通过刷新加载的
                const currentUrl = window.location.href.split('?')[0];
                window.history.replaceState(null, '', currentUrl + '?forceReload=' + timestamp);
            }
            
            startProgress();
        });
        
        // 开始进度动画
        function startProgress() {
            progressInterval = setInterval(updateProgress, 30);
        }
        
        // 更新进度
        function updateProgress() {
            if (progress < 100) {
                progress += 0.5;
                const displayProgress = Math.min(progress, 99);
                
                progressBar.style.width = displayProgress + '%';
                percentElement.textContent = Math.floor(displayProgress) + '%';
                
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    performRedirect();
                }
            }
        }
        
        // 执行跳转
        function performRedirect() {
            const redirectUrl = targetUrl + '?nocache=' + timestamp + '&r=' + randomId;
            window.location.replace(redirectUrl);
        }
        
        // 手动跳转按钮事件
        manualJumpBtn.addEventListener('click', function() {
            clearInterval(progressInterval);
            progressBar.style.width = '100%';
            percentElement.textContent = '100%';
            setTimeout(performRedirect, 300);
        });
        
        // 刷新页面按钮事件
        refreshPageBtn.addEventListener('click', function() {
            window.location.href = window.location.href.split('?')[0] + '?refresh=' + Date.now();
        });
        
        // 防止页面缓存
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
        
        // 键盘快捷键支持
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                manualJumpBtn.click();
            }
            if (event.key === 'r' || event.key === 'R') {
                refreshPageBtn.click();
            }
        });
        
        // 防止后退按钮导致缓存
        window.addEventListener('beforeunload', function() {
            // 空函数，防止某些浏览器的缓存行为
        });
        
        // 超时处理
        setTimeout(function() {
            if (progress < 100) {
                console.log('跳转超时，强制执行');
                performRedirect();
            }
        }, 10000); // 10秒超时
    </script>
</body>
</html>
